server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        same-site: strict

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cors:
    allowed-origins:
      - ${APP_CORS_ALLOWED_ORIGIN:https://app.example.com}
